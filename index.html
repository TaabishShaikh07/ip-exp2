
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calculator</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./dist/script.js" defer></script>
</head>
<body>
  <div class="calculator">
    <h2>My Calculator</h2>

    <input id="display" type="text" value="0" readonly>

    <div class="buttons">
      <button data-action="clear">AC</button>
      <button data-action="operator" data-value="/">÷</button>
      <button data-action="operator" data-value="*">×</button>
      <button data-action="delete">DEL</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-action="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-action="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-action="equals" class="equals">=</button>

      <button data-action="sign">±</button>
      <button data-value="0">0</button>
      <button data-action="decimal">.</button>
    </div>
  </div>
</body>
</html>
